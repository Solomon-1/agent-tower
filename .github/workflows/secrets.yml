name: secret scan
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Block keys and passwords
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact -v
      - name: Block plain personal data and known key names
        run: |
          if grep -RInE "web_key\s*[:=]\s*['\"][A-Za-z0-9_-]{12,}|vapi_public_key\s*[:=]\s*['\"][0-9a-f-]{20,}|GOCSPX-|sk-ant-|-----BEGIN" --exclude-dir=.git --exclude-dir=.githooks --exclude-dir=.github --exclude=site.bin . ; then echo "Found something that looks like a secret"; exit 1; fi
